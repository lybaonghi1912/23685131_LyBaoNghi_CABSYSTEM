openapi: 3.0.3
info:
  title: CAB System API
  version: 1.0.0
  description: |
    API Specification cho CAB System MVP, được xây dựng từ Functional Requirement
    FR01–FR27 và Acceptance Criteria AC01–AC27 trong `srs.md`.

    Các xử lý tự động như lọc và sắp xếp tài xế, tạo đề xuất chuyến, tính cước,
    đồng bộ trạng thái tài xế và tạo thông báo được thực hiện bên trong các API
    nghiệp vụ liên quan, không tách thành API công khai riêng.
servers:
- url: http://localhost:3000/api/v1
  description: Máy chủ phát triển cục bộ
security:
- bearerAuth: []
tags:
- name: Authentication
  description: Đăng ký, đăng nhập và cấp phiên xác thực
- name: Profiles
  description: Hồ sơ người dùng, phương tiện và trạng thái tài xế
- name: Trips
  description: Đặt, theo dõi, hủy và cập nhật chuyến đi
- name: Driver Offers
  description: Đề xuất chuyến và phản hồi của tài xế
- name: Payments
  description: Thanh toán tiền mặt và điện tử mô phỏng
- name: Notifications
  description: Thông báo của khách hàng và tài xế
- name: Ratings
  description: Đánh giá tài xế sau chuyến đi
- name: Operations
  description: Tra cứu và báo cáo dành cho nhân viên vận hành
paths:
  /auth/register:
    $ref: ./paths/authentication.yaml#/register
  /auth/login:
    $ref: ./paths/authentication.yaml#/login
  /users/me:
    $ref: ./paths/profiles.yaml#/myProfile
  /drivers/me/vehicle:
    $ref: ./paths/profiles.yaml#/myVehicle
  /drivers/me/status:
    $ref: ./paths/profiles.yaml#/myDriverStatus
  /trips:
    $ref: ./paths/trips.yaml#/trips
  /trips/current:
    $ref: ./paths/trips.yaml#/currentTrip
  /trips/{tripId}:
    $ref: ./paths/trips.yaml#/tripById
  /trips/{tripId}/cancel:
    $ref: ./paths/trips.yaml#/cancelTrip
  /trips/{tripId}/status:
    $ref: ./paths/trips.yaml#/tripStatus
  /me/trips:
    $ref: ./paths/trips.yaml#/myTripHistory
  /driver-offers/current:
    $ref: ./paths/driver-offers.yaml#/currentDriverOffer
  /driver-offers/{offerId}/response:
    $ref: ./paths/driver-offers.yaml#/driverOfferResponse
  /trips/{tripId}/payments:
    $ref: ./paths/payments.yaml#/tripPayments
  /notifications:
    $ref: ./paths/notifications.yaml#/notifications
  /trips/{tripId}/ratings:
    $ref: ./paths/ratings.yaml#/tripRatings
  /operator/customers:
    $ref: ./paths/operations.yaml#/operatorCustomers
  /operator/customers/{customerId}:
    $ref: ./paths/operations.yaml#/operatorCustomerById
  /operator/drivers:
    $ref: ./paths/operations.yaml#/operatorDrivers
  /operator/drivers/{driverId}:
    $ref: ./paths/operations.yaml#/operatorDriverById
  /operator/vehicles:
    $ref: ./paths/operations.yaml#/operatorVehicles
  /operator/vehicles/{vehicleId}:
    $ref: ./paths/operations.yaml#/operatorVehicleById
  /operator/trips:
    $ref: ./paths/operations.yaml#/operatorTrips
  /operator/trips/{tripId}:
    $ref: ./paths/operations.yaml#/operatorTripById
  /operator/reports/summary:
    $ref: ./paths/operations.yaml#/operatorReportSummary
