notifications:
  get:
    tags:
    - Notifications
    summary: Xem danh sách thông báo của tài khoản
    description: |
      Chỉ trả về thông báo thuộc tài khoản đang đăng nhập, sắp xếp mới nhất trước.
      Thông báo được hệ thống tạo khi có thay đổi quan trọng về tìm tài xế,
      trạng thái chuyến hoặc thanh toán.
    operationId: getMyNotifications
    x-requirements:
      fr:
      - FR21
      - FR22
      ac:
      - AC21
      - AC22
    responses:
      '200':
        description: Lấy danh sách thông báo thành công; có thể trả về mảng rỗng
        content:
          application/json:
            schema:
              $ref: ../components/schemas/response-wrappers.yaml#/NotificationListResponse
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
