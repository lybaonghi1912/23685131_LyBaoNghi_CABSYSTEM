openapi: 3.0.3
info:
  title: CAB System API - BR05 - Quản lý quá trình thực hiện chuyến
  version: 1.0.0
  description: |-
    API Specification độc lập cho BR05 - Quản lý quá trình thực hiện chuyến.

    Phạm vi: Hủy chuyến, cập nhật đúng trình tự trạng thái và đồng bộ trạng thái tài xế.

    Functional Requirements: FR15, FR16, FR17.
    Acceptance Criteria: AC15, AC16, AC17.
servers:
- url: http://localhost:3000/api/v1
  description: Máy chủ phát triển cục bộ
security:
- bearerAuth: []
x-requirements:
  fr:
  - FR15
  - FR16
  - FR17
  ac:
  - AC15
  - AC16
  - AC17
tags:
- name: Trips
  description: Đặt, theo dõi, hủy và cập nhật chuyến đi
paths:
  /trips/{tripId}/cancel:
    parameters:
    - $ref: '#/components/parameters/TripId'
    post:
      tags:
      - Trips
      summary: Hủy chuyến
      description: |
        Khách hàng sở hữu chuyến hoặc tài xế được phân công được hủy trước khi
        chuyến chuyển sang `IN_PROGRESS`. Hệ thống chuyển chuyến sang `CANCELLED`,
        trả tài xế về `AVAILABLE` nếu cần và tạo thông báo liên quan.
      operationId: cancelTrip
      x-requirements:
        fr:
        - FR16
        - FR17
        - FR21
        ac:
        - AC16
        - AC17
        - AC21
      responses:
        '200':
          description: Hủy chuyến thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Không thể hủy chuyến ở trạng thái hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Không thể hủy chuyến sau khi đã bắt đầu
                error:
                  code: TRIP_CANNOT_BE_CANCELLED
  /trips/{tripId}/status:
    parameters:
    - $ref: '#/components/parameters/TripId'
    patch:
      tags:
      - Trips
      summary: Cập nhật trạng thái chuyến
      description: |
        Chỉ tài xế được phân công mới được cập nhật lần lượt
        `ACCEPTED → ARRIVED → IN_PROGRESS → COMPLETED`.
        Không được bỏ qua, quay ngược hoặc cập nhật chuyến đã kết thúc.

        Khi chuyển sang `COMPLETED`, hệ thống tính cước theo loại xe và khoảng cách,
        lưu `fare_amount`, lưu `completed_at`, chuyển tài xế về `AVAILABLE` và tạo
        thông báo cho khách hàng.
      operationId: updateTripStatus
      x-requirements:
        fr:
        - FR15
        - FR17
        - FR18
        - FR21
        ac:
        - AC15
        - AC17
        - AC18
        - AC21
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripStatusRequest'
            example:
              trip_status: ARRIVED
      responses:
        '200':
          description: Cập nhật trạng thái thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Sai trình tự hoặc chuyến đã kết thúc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Trạng thái mới không đúng trình tự
                error:
                  code: INVALID_TRIP_STATUS_TRANSITION
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token nhận được sau khi đăng nhập
  schemas:
    ErrorResponse:
      type: object
      required:
      - success
      - message
      - error
      properties:
        success:
          type: boolean
          enum:
          - false
        message:
          type: string
        error:
          $ref: '#/components/schemas/ErrorInfo'
    ErrorInfo:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        details:
          type: array
          items:
            $ref: '#/components/schemas/ValidationDetail'
    ValidationDetail:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    TripResponse:
      type: object
      required:
      - success
      - message
      - data
      properties:
        success:
          type: boolean
          enum:
          - true
        message:
          type: string
        data:
          $ref: '#/components/schemas/Trip'
    Trip:
      type: object
      required:
      - id
      - customer_id
      - vehicle_type
      - pickup_address
      - pickup_latitude
      - pickup_longitude
      - destination_address
      - destination_latitude
      - destination_longitude
      - distance_km
      - trip_status
      - fare_amount
      - created_at
      properties:
        id:
          type: string
          example: trip_001
        customer_id:
          type: string
          example: user_customer_001
        driver_id:
          type: string
          nullable: true
          example: driver_001
        driver:
          allOf:
          - $ref: '#/components/schemas/DriverSummary'
          nullable: true
        vehicle_type:
          $ref: '#/components/schemas/VehicleType'
        pickup_address:
          type: string
        pickup_latitude:
          type: number
          format: double
        pickup_longitude:
          type: number
          format: double
        destination_address:
          type: string
        destination_latitude:
          type: number
          format: double
        destination_longitude:
          type: number
          format: double
        distance_km:
          type: number
          format: double
          minimum: 0
        trip_status:
          $ref: '#/components/schemas/TripStatus'
        fare_amount:
          type: number
          format: double
          minimum: 0
          description: |
            Bằng 0 trước khi hoàn thành. Khi `COMPLETED`:
            `MOTORBIKE = 10000 + distance_km × 5000`;
            `CAR = 20000 + distance_km × 10000`.
          example: 37000
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
    TripStatus:
      type: string
      enum:
      - SEARCHING
      - ACCEPTED
      - ARRIVED
      - IN_PROGRESS
      - COMPLETED
      - CANCELLED
      - NO_DRIVER
    VehicleType:
      type: string
      enum:
      - MOTORBIKE
      - CAR
    DriverSummary:
      type: object
      required:
      - id
      - full_name
      - phone
      - average_rating
      - vehicle
      properties:
        id:
          type: string
          example: driver_001
        full_name:
          type: string
          example: Trần Văn Bình
        phone:
          type: string
          example: 0987654321
        average_rating:
          type: number
          format: double
          example: 4.8
        vehicle:
          $ref: '#/components/schemas/Vehicle'
    Vehicle:
      type: object
      required:
      - id
      - driver_id
      - vehicle_type
      - license_plate
      properties:
        id:
          type: string
          example: vehicle_001
        driver_id:
          type: string
          example: driver_001
        vehicle_type:
          $ref: '#/components/schemas/VehicleType'
        license_plate:
          type: string
          example: 59A1-12345
        brand:
          type: string
          nullable: true
          example: Honda Wave
    TripStatusRequest:
      type: object
      additionalProperties: false
      required:
      - trip_status
      properties:
        trip_status:
          type: string
          enum:
          - ARRIVED
          - IN_PROGRESS
          - COMPLETED
  responses:
    NotFound:
      description: Không tìm thấy dữ liệu yêu cầu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Không tìm thấy dữ liệu
            error:
              code: NOT_FOUND
    Forbidden:
      description: Tài khoản không có quyền thực hiện chức năng
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Bạn không có quyền thực hiện chức năng này
            error:
              code: FORBIDDEN
    Unauthorized:
      description: Chưa đăng nhập hoặc token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Bạn cần đăng nhập
            error:
              code: UNAUTHORIZED
    BadRequest:
      description: Dữ liệu đầu vào thiếu hoặc không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Dữ liệu đầu vào không hợp lệ
            error:
              code: VALIDATION_ERROR
              details:
              - field: vehicle_type
                message: Giá trị không hợp lệ
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      description: Mã chuyến đi
      schema:
        type: string
      example: trip_001
