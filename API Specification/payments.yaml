openapi: 3.0.3
info:
  title: CAB System - Payments API
  version: 1.1.1
  description: >-
    API thanh toán cho chuyến đã hoàn thành. Đồng bộ với FR18-FR20, FR21 và AC18-AC21.
servers:
  - url: http://localhost:3000/api/v1
security:
  - bearerAuth: []
tags:
  - name: Payments
paths:
  /trips/{tripId}/payments:
    parameters:
      - $ref: '#/components/parameters/TripId'
    post:
      tags: [Payments]
      summary: Thanh toán chuyến đi
      operationId: createPayment
      description: >-
        Chỉ CUSTOMER sở hữu trip COMPLETED được thanh toán. Một trip có thể có nhiều
        payment FAILED nhưng tối đa một SUCCESS. Amount luôn lấy từ fare_amount của trip,
        không nhận từ client. CASH luôn SUCCESS. ELECTRONIC yêu cầu simulated_result để
        mô phỏng SUCCESS hoặc FAILED. Trạng thái PENDING được giữ trong data model cho bước
        xử lý trung gian, nhưng response cuối của thao tác mô phỏng trả SUCCESS hoặc FAILED.
      x-requirements:
        fr: [FR18, FR19, FR20, FR21]
        ac: [AC18, AC19, AC20, AC21]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CashPaymentRequest'
                - $ref: '#/components/schemas/ElectronicPaymentRequest'
              discriminator:
                propertyName: payment_method
                mapping:
                  CASH: '#/components/schemas/CashPaymentRequest'
                  ELECTRONIC: '#/components/schemas/ElectronicPaymentRequest'
            examples:
              cash:
                value:
                  payment_method: CASH
              electronicSuccess:
                value:
                  payment_method: ELECTRONIC
                  simulated_result: SUCCESS
              electronicFailed:
                value:
                  payment_method: ELECTRONIC
                  simulated_result: FAILED
      responses:
        '201':
          description: Giao dịch được tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Trip chưa COMPLETED hoặc đã có payment SUCCESS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Dữ liệu thanh toán không hợp lệ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Chưa đăng nhập hoặc token không hợp lệ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Không phải Customer sở hữu trip
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Không tìm thấy trip
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    CashPaymentRequest:
      type: object
      additionalProperties: false
      required: [payment_method]
      properties:
        payment_method:
          type: string
          enum: [CASH]
    ElectronicPaymentRequest:
      type: object
      additionalProperties: false
      required: [payment_method, simulated_result]
      properties:
        payment_method:
          type: string
          enum: [ELECTRONIC]
        simulated_result:
          type: string
          enum: [SUCCESS, FAILED]
    PaymentMethod:
      type: string
      enum: [CASH, ELECTRONIC]
    PaymentStatus:
      type: string
      enum: [PENDING, SUCCESS, FAILED]
    Payment:
      type: object
      required: [id, trip_id, payment_method, payment_status, amount, created_at]
      properties:
        id: { type: string, example: payment_001 }
        trip_id: { type: string, example: trip_001 }
        payment_method: { $ref: '#/components/schemas/PaymentMethod' }
        payment_status: { $ref: '#/components/schemas/PaymentStatus' }
        amount:
          type: number
          format: double
          minimum: 0
          description: Luôn bằng fare_amount của trip.
        created_at: { type: string, format: date-time }
    ErrorInfo:
      type: object
      required: [code]
      properties:
        code: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    ErrorResponse:
      type: object
      required: [success, message, error]
      properties:
        success: { type: boolean, enum: [false] }
        message: { type: string }
        error: { $ref: '#/components/schemas/ErrorInfo' }
    PaymentResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        data: { $ref: '#/components/schemas/Payment' }
