openapi: 3.0.3
info:
  title: CAB System - Ratings API
  version: 1.0.0
  description: 'API Specification cho CAB System MVP, được xây dựng từ Functional Requirement

    FR01–FR27 và Acceptance Criteria AC01–AC27 trong `srs.md`.


    Các xử lý tự động như lọc và sắp xếp tài xế, tạo đề xuất chuyến, tính cước,

    đồng bộ trạng thái tài xế và tạo thông báo được thực hiện bên trong các API

    nghiệp vụ liên quan, không tách thành API công khai riêng.

    '
servers:
- url: http://localhost:3000/api/v1
  description: Máy chủ phát triển cục bộ
security:
- bearerAuth: []
tags:
- name: Ratings
  description: Đánh giá tài xế sau chuyến đi
paths:
  /trips/{tripId}/ratings:
    parameters:
    - $ref: '#/components/parameters/TripId'
    post:
      tags:
      - Ratings
      summary: Đánh giá tài xế
      description: 'Khách hàng sở hữu chuyến được đánh giá đúng một lần sau khi chuyến

        `COMPLETED`. Điểm phải là số nguyên từ 1 đến 5. Sau khi lưu, hệ thống

        cập nhật điểm trung bình của tài xế.

        '
      operationId: rateDriver
      x-requirements:
        fr:
        - FR24
        ac:
        - AC24
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRatingRequest'
            example:
              score: 5
              comment: Tài xế thân thiện và đến đúng giờ
      responses:
        '201':
          description: Đánh giá được tạo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Chuyến chưa hoàn thành hoặc đã được đánh giá
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token nhận được sau khi đăng nhập
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      description: Mã chuyến đi
      schema:
        type: string
      example: trip_001
  responses:
    BadRequest:
      description: Dữ liệu đầu vào thiếu hoặc không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Dữ liệu đầu vào không hợp lệ
            error:
              code: VALIDATION_ERROR
              details:
              - field: vehicle_type
                message: Giá trị không hợp lệ
    Unauthorized:
      description: Chưa đăng nhập hoặc token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Bạn cần đăng nhập
            error:
              code: UNAUTHORIZED
    Forbidden:
      description: Tài khoản không có quyền thực hiện chức năng
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Bạn không có quyền thực hiện chức năng này
            error:
              code: FORBIDDEN
    NotFound:
      description: Không tìm thấy dữ liệu yêu cầu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Không tìm thấy dữ liệu
            error:
              code: NOT_FOUND
  schemas:
    CreateRatingRequest:
      type: object
      additionalProperties: false
      required:
      - score
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 500
    Rating:
      type: object
      required:
      - id
      - trip_id
      - customer_id
      - driver_id
      - score
      - created_at
      properties:
        id:
          type: string
          example: rating_001
        trip_id:
          type: string
          example: trip_001
        customer_id:
          type: string
          example: user_customer_001
        driver_id:
          type: string
          example: driver_001
        score:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          nullable: true
          example: Tài xế thân thiện và đến đúng giờ
        created_at:
          type: string
          format: date-time
    ValidationDetail:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    ErrorInfo:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        details:
          type: array
          items:
            $ref: '#/components/schemas/ValidationDetail'
    ErrorResponse:
      type: object
      required:
      - success
      - message
      - error
      properties:
        success:
          type: boolean
          enum:
          - false
        message:
          type: string
        error:
          $ref: '#/components/schemas/ErrorInfo'
    RatingResponse:
      type: object
      required:
      - success
      - message
      - data
      properties:
        success:
          type: boolean
          enum:
          - true
        message:
          type: string
        data:
          $ref: '#/components/schemas/Rating'
