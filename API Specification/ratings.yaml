openapi: 3.0.3
info:
  title: CAB System - Ratings API
  version: 1.1.0
  description: >-
    API đánh giá tài xế sau chuyến đi. Đồng bộ với FR24 và AC24 trong srs.md.
servers:
  - url: http://localhost:3000/api/v1
security:
  - bearerAuth: []
tags:
  - name: Ratings
paths:
  /trips/{tripId}/ratings:
    parameters:
      - $ref: '#/components/parameters/TripId'
    post:
      tags: [Ratings]
      summary: Đánh giá tài xế
      operationId: rateDriver
      description: >-
        Chỉ CUSTOMER sở hữu trip được đánh giá. Trip phải COMPLETED, phải có ít nhất
        một payment SUCCESS và chưa từng được đánh giá. Mỗi trip chỉ có tối đa một rating.
      x-requirements:
        fr: [FR24]
        ac: [AC24]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRatingRequest' }
            example:
              score: 5
              comment: Tài xế thân thiện
      responses:
        '201':
          description: Tạo đánh giá thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RatingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Trip chưa COMPLETED, chưa có payment SUCCESS hoặc đã có rating
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Score/comment không hợp lệ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Chưa đăng nhập hoặc token không hợp lệ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Không phải Customer sở hữu trip
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Không tìm thấy trip
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    CreateRatingRequest:
      type: object
      additionalProperties: false
      required: [score]
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 500
    Rating:
      type: object
      required: [id, trip_id, customer_id, driver_id, score, created_at]
      properties:
        id: { type: string, example: rating_001 }
        trip_id: { type: string, example: trip_001 }
        customer_id: { type: string }
        driver_id: { type: string }
        score: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true, maxLength: 500 }
        created_at: { type: string, format: date-time }
    ErrorInfo:
      type: object
      required: [code]
      properties:
        code: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    ErrorResponse:
      type: object
      required: [success, message, error]
      properties:
        success: { type: boolean, enum: [false] }
        message: { type: string }
        error: { $ref: '#/components/schemas/ErrorInfo' }
    RatingResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        data: { $ref: '#/components/schemas/Rating' }
