openapi: 3.0.3
info:
  title: CAB System - Trips API
  version: 1.1.0
  description: >-
    API đặt xe, theo dõi, hủy, cập nhật trạng thái và xem lịch sử chuyến.
    Đồng bộ với FR07-FR18, FR21, FR23 và các AC liên quan trong srs.md.
servers:
  - url: http://localhost:3000/api/v1
security:
  - bearerAuth: []
tags:
  - name: Trips
paths:
  /trips:
    post:
      tags: [Trips]
      summary: Tạo yêu cầu đặt xe
      operationId: createTrip
      description: >-
        Chỉ CUSTOMER được tạo chuyến. Hệ thống tạo TRIP ở SEARCHING và kích hoạt
        quá trình tìm tài xế phù hợp. Customer không được có một active trip khác.
      x-requirements:
        fr: [FR07, FR08, FR10, FR11, FR12, FR14, FR21]
        ac: [AC07, AC08, AC10, AC11, AC12, AC14, AC21]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTripRequest' }
            example:
              vehicle_type: MOTORBIKE
              pickup_address: Đại học Công nghiệp TP.HCM
              pickup_latitude: 10.8222
              pickup_longitude: 106.6872
              destination_address: Sân bay Tân Sơn Nhất
              destination_latitude: 10.8188
              destination_longitude: 106.6519
              distance_km: 5.4
      responses:
        '201':
          description: Tạo chuyến thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Customer đang có active trip
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /trips/current:
    get:
      tags: [Trips]
      summary: Xem chuyến hiện tại của Customer
      operationId: getCurrentTrip
      x-requirements:
        fr: [FR09]
        ac: [AC09]
      responses:
        '200':
          description: Lấy chuyến hiện tại thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Không có active trip
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /trips/{tripId}:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [Trips]
      summary: Xem chi tiết chuyến liên quan tới tài khoản
      operationId: getTripById
      description: >-
        CUSTOMER chỉ xem trip của mình. DRIVER chỉ xem trip đã được phân công hoặc
        trip thuộc offer dành cho mình. OPERATOR dùng API riêng trong operations.yaml.
      x-requirements:
        fr: [FR09, FR23]
        ac: [AC09, AC23]
      responses:
        '200':
          description: Lấy chi tiết thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trips/{tripId}/cancel:
    parameters:
      - $ref: '#/components/parameters/TripId'
    post:
      tags: [Trips]
      summary: Hủy chuyến
      operationId: cancelTrip
      description: >-
        CUSTOMER được hủy SEARCHING, ACCEPTED hoặc ARRIVED. DRIVER chỉ được hủy trip
        đã được phân công ở ACCEPTED hoặc ARRIVED. reason là bắt buộc. Nếu CUSTOMER
        hủy khi trip SEARCHING thì offer PENDING hiện tại phải chuyển CANCELLED.
      x-requirements:
        fr: [FR16, FR17, FR21]
        ac: [AC16, AC17, AC21]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelTripRequest' }
            example:
              reason: Thay đổi kế hoạch
      responses:
        '200':
          description: Hủy chuyến thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Không thể hủy ở trạng thái hiện tại
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /trips/{tripId}/status:
    parameters:
      - $ref: '#/components/parameters/TripId'
    patch:
      tags: [Trips]
      summary: Cập nhật trạng thái chuyến
      operationId: updateTripStatus
      description: >-
        Chỉ DRIVER được phân công mới được cập nhật tuần tự
        ACCEPTED -> ARRIVED -> IN_PROGRESS -> COMPLETED. Khi COMPLETED, hệ thống tính fare,
        lưu completed_at, chuyển Driver về AVAILABLE và tạo notification.
      x-requirements:
        fr: [FR15, FR17, FR18, FR21]
        ac: [AC15, AC17, AC18, AC21]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripStatusRequest' }
      responses:
        '200':
          description: Cập nhật trạng thái thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Sai trình tự hoặc trip đã kết thúc
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /me/trips:
    get:
      tags: [Trips]
      summary: Xem lịch sử chuyến của tài khoản
      operationId: getMyTripHistory
      description: >-
        CUSTOMER nhận trip của mình, mới nhất trước, kèm payment_summary nếu có.
        DRIVER nhận trip đã được phân công nhưng không nhận payment_summary của Customer.
      x-requirements:
        fr: [FR23]
        ac: [AC23]
      responses:
        '200':
          description: Lấy lịch sử thành công; có thể là mảng rỗng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripHistoryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema: { type: string }
      example: trip_001
  responses:
    BadRequest:
      description: Dữ liệu đầu vào không hợp lệ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Chưa đăng nhập hoặc token không hợp lệ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Không đúng role hoặc không sở hữu tài nguyên
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Không tìm thấy trip
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    VehicleType:
      type: string
      enum: [MOTORBIKE, CAR]
    TripStatus:
      type: string
      enum: [SEARCHING, ACCEPTED, ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED, NO_DRIVER]
    CreateTripRequest:
      type: object
      additionalProperties: false
      required:
        [vehicle_type, pickup_address, pickup_latitude, pickup_longitude, destination_address, destination_latitude, destination_longitude, distance_km]
      properties:
        vehicle_type: { $ref: '#/components/schemas/VehicleType' }
        pickup_address: { type: string, minLength: 1 }
        pickup_latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        pickup_longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        destination_address: { type: string, minLength: 1 }
        destination_latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        destination_longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        distance_km:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
    CancelTripRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    TripStatusRequest:
      type: object
      additionalProperties: false
      required: [trip_status]
      properties:
        trip_status:
          type: string
          enum: [ARRIVED, IN_PROGRESS, COMPLETED]
    Vehicle:
      type: object
      required: [id, driver_id, vehicle_type, license_plate]
      properties:
        id: { type: string }
        driver_id: { type: string }
        vehicle_type: { $ref: '#/components/schemas/VehicleType' }
        license_plate: { type: string }
        brand: { type: string, nullable: true }
    DriverSummary:
      type: object
      required: [id, full_name, phone, average_rating, vehicle]
      properties:
        id: { type: string }
        full_name: { type: string }
        phone: { type: string }
        average_rating: { type: number, format: double, minimum: 0, maximum: 5 }
        vehicle: { $ref: '#/components/schemas/Vehicle' }
    Trip:
      type: object
      required:
        [id, customer_id, vehicle_type, pickup_address, pickup_latitude, pickup_longitude, destination_address, destination_latitude, destination_longitude, distance_km, trip_status, fare_amount, created_at]
      properties:
        id: { type: string, example: trip_001 }
        customer_id: { type: string }
        driver_id: { type: string, nullable: true }
        driver:
          allOf:
            - $ref: '#/components/schemas/DriverSummary'
          nullable: true
        vehicle_type: { $ref: '#/components/schemas/VehicleType' }
        pickup_address: { type: string }
        pickup_latitude: { type: number, format: double }
        pickup_longitude: { type: number, format: double }
        destination_address: { type: string }
        destination_latitude: { type: number, format: double }
        destination_longitude: { type: number, format: double }
        distance_km: { type: number, format: double, minimum: 0 }
        trip_status: { $ref: '#/components/schemas/TripStatus' }
        fare_amount:
          type: number
          format: double
          minimum: 0
          description: Bằng 0 trước khi hoàn thành; tính theo RULE10-RULE11 khi COMPLETED.
        cancel_reason:
          type: string
          nullable: true
          description: Bắt buộc có giá trị khi trip_status là CANCELLED.
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
    PaymentSummary:
      type: object
      required: [payment_method, payment_status, amount]
      properties:
        payment_method:
          type: string
          enum: [CASH, ELECTRONIC]
        payment_status:
          type: string
          enum: [SUCCESS, FAILED]
        amount:
          type: number
          format: double
          minimum: 0
    TripHistoryItem:
      allOf:
        - $ref: '#/components/schemas/Trip'
        - type: object
          properties:
            payment_summary:
              allOf:
                - $ref: '#/components/schemas/PaymentSummary'
              nullable: true
              description: Chỉ trả cho CUSTOMER; DRIVER không nhận dữ liệu payment của Customer.
    ErrorInfo:
      type: object
      required: [code]
      properties:
        code: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    ErrorResponse:
      type: object
      required: [success, message, error]
      properties:
        success: { type: boolean, enum: [false] }
        message: { type: string }
        error: { $ref: '#/components/schemas/ErrorInfo' }
    TripResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        data: { $ref: '#/components/schemas/Trip' }
    TripHistoryResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/TripHistoryItem' }
