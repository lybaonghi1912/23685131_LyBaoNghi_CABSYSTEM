openapi: 3.0.3
info:
  title: CAB System - Operations API
  version: 1.1.0
  description: >-
    API read-only dành cho OPERATOR để tra cứu dữ liệu vận hành và xem báo cáo cơ bản.
    Đồng bộ với FR25-FR27 và AC25-AC27 trong srs.md. OPERATOR không CRUD, không hủy
    chuyến thay người dùng và không quản trị giao dịch.
servers:
  - url: http://localhost:3000/api/v1
security:
  - bearerAuth: []
tags:
  - name: Operations
paths:
  /operator/customers:
    get:
      tags: [Operations]
      summary: Tra cứu khách hàng
      operationId: searchCustomers
      x-requirements:
        fr: [FR25]
        ac: [AC25]
      parameters:
        - $ref: '#/components/parameters/Keyword'
      responses:
        '200':
          description: Danh sách khách hàng; có thể rỗng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /operator/customers/{customerId}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [Operations]
      summary: Xem chi tiết khách hàng
      operationId: getCustomerForOperator
      x-requirements:
        fr: [FR25]
        ac: [AC25]
      responses:
        '200':
          description: Lấy khách hàng thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /operator/drivers:
    get:
      tags: [Operations]
      summary: Tra cứu tài xế
      operationId: searchDrivers
      x-requirements:
        fr: [FR25]
        ac: [AC25]
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/DriverStatus' }
      responses:
        '200':
          description: Danh sách tài xế; có thể rỗng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /operator/drivers/{driverId}:
    parameters:
      - $ref: '#/components/parameters/DriverId'
    get:
      tags: [Operations]
      summary: Xem chi tiết tài xế
      operationId: getDriverForOperator
      x-requirements:
        fr: [FR25]
        ac: [AC25]
      responses:
        '200':
          description: Lấy tài xế thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverDetailsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /operator/vehicles:
    get:
      tags: [Operations]
      summary: Tra cứu phương tiện
      operationId: searchVehicles
      x-requirements:
        fr: [FR25]
        ac: [AC25]
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - name: vehicle_type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/VehicleType' }
      responses:
        '200':
          description: Danh sách phương tiện; có thể rỗng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /operator/vehicles/{vehicleId}:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    get:
      tags: [Operations]
      summary: Xem chi tiết phương tiện
      operationId: getVehicleForOperator
      x-requirements:
        fr: [FR25]
        ac: [AC25]
      responses:
        '200':
          description: Lấy phương tiện thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /operator/trips:
    get:
      tags: [Operations]
      summary: Theo dõi và lọc chuyến
      operationId: searchTripsForOperator
      x-requirements:
        fr: [FR25, FR26]
        ac: [AC25, AC26]
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TripStatus' }
      responses:
        '200':
          description: Danh sách chuyến đúng điều kiện; có thể rỗng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /operator/trips/{tripId}:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [Operations]
      summary: Xem chi tiết chuyến
      operationId: getTripForOperator
      description: Trip CANCELLED trả cancel_reason để Operator tra cứu nguyên nhân hủy.
      x-requirements:
        fr: [FR25, FR26]
        ac: [AC25, AC26]
      responses:
        '200':
          description: Lấy chuyến thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /operator/reports/summary:
    get:
      tags: [Operations]
      summary: Xem báo cáo hoạt động cơ bản
      operationId: getOperationSummary
      description: >-
        Trả tổng số trip, số COMPLETED, số CANCELLED và doanh thu là tổng amount
        của các payment SUCCESS. Nếu chưa có dữ liệu thì các giá trị bằng 0.
      x-requirements:
        fr: [FR27]
        ac: [AC27]
      responses:
        '200':
          description: Lấy báo cáo thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Keyword:
      name: keyword
      in: query
      required: false
      schema: { type: string, maxLength: 100 }
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: { type: string }
    DriverId:
      name: driverId
      in: path
      required: true
      schema: { type: string }
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema: { type: string }
    TripId:
      name: tripId
      in: path
      required: true
      schema: { type: string }
  responses:
    Unauthorized:
      description: Chưa đăng nhập hoặc token không hợp lệ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Chỉ OPERATOR được sử dụng API này
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Không tìm thấy dữ liệu
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalServerError:
      description: Lỗi hệ thống
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    UserRole:
      type: string
      enum: [CUSTOMER, DRIVER, OPERATOR]
    DriverStatus:
      type: string
      enum: [AVAILABLE, BUSY, OFFLINE]
    VehicleType:
      type: string
      enum: [MOTORBIKE, CAR]
    TripStatus:
      type: string
      enum: [SEARCHING, ACCEPTED, ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED, NO_DRIVER]
    User:
      type: object
      required: [id, full_name, email, phone, role, created_at]
      properties:
        id: { type: string }
        full_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        created_at: { type: string, format: date-time }
    DriverProfile:
      type: object
      required: [id, user_id, driver_status, average_rating]
      properties:
        id: { type: string }
        user_id: { type: string }
        driver_status: { $ref: '#/components/schemas/DriverStatus' }
        current_latitude: { type: number, format: double, nullable: true, minimum: -90, maximum: 90 }
        current_longitude: { type: number, format: double, nullable: true, minimum: -180, maximum: 180 }
        average_rating: { type: number, format: double, minimum: 0, maximum: 5 }
    Vehicle:
      type: object
      required: [id, driver_id, vehicle_type, license_plate]
      properties:
        id: { type: string }
        driver_id: { type: string }
        vehicle_type: { $ref: '#/components/schemas/VehicleType' }
        license_plate: { type: string }
        brand: { type: string, nullable: true }
    DriverDetails:
      type: object
      required: [user, driver_profile]
      properties:
        user: { $ref: '#/components/schemas/User' }
        driver_profile: { $ref: '#/components/schemas/DriverProfile' }
        vehicle:
          allOf:
            - $ref: '#/components/schemas/Vehicle'
          nullable: true
    Trip:
      type: object
      required: [id, customer_id, vehicle_type, pickup_address, destination_address, distance_km, trip_status, fare_amount, created_at]
      properties:
        id: { type: string }
        customer_id: { type: string }
        driver_id: { type: string, nullable: true }
        vehicle_type: { $ref: '#/components/schemas/VehicleType' }
        pickup_address: { type: string }
        pickup_latitude: { type: number, format: double }
        pickup_longitude: { type: number, format: double }
        destination_address: { type: string }
        destination_latitude: { type: number, format: double }
        destination_longitude: { type: number, format: double }
        distance_km: { type: number, format: double, minimum: 0 }
        trip_status: { $ref: '#/components/schemas/TripStatus' }
        fare_amount: { type: number, format: double, minimum: 0 }
        cancel_reason:
          type: string
          nullable: true
          description: Có giá trị khi trip_status là CANCELLED.
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
    ReportSummary:
      type: object
      required: [total_trips, completed_trips, cancelled_trips, total_revenue]
      properties:
        total_trips: { type: integer, minimum: 0 }
        completed_trips: { type: integer, minimum: 0 }
        cancelled_trips: { type: integer, minimum: 0 }
        total_revenue:
          type: number
          format: double
          minimum: 0
          description: Tổng amount của payment SUCCESS.
    ErrorInfo:
      type: object
      required: [code]
      properties:
        code: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    ErrorResponse:
      type: object
      required: [success, message, error]
      properties:
        success: { type: boolean, enum: [false] }
        message: { type: string }
        error: { $ref: '#/components/schemas/ErrorInfo' }
    UserResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        data: { $ref: '#/components/schemas/User' }
    UserListResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/User' }
    DriverDetailsResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        data: { $ref: '#/components/schemas/DriverDetails' }
    DriverListResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/DriverDetails' }
    VehicleResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        data: { $ref: '#/components/schemas/Vehicle' }
    VehicleListResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/Vehicle' }
    TripResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        data: { $ref: '#/components/schemas/Trip' }
    TripListResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/Trip' }
    ReportResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        data: { $ref: '#/components/schemas/ReportSummary' }
