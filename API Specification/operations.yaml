operatorReportSummary:
  get:
    tags:
    - Operations
    summary: Xem báo cáo hoạt động cơ bản
    description: |
      Trả về tổng số chuyến, số chuyến `COMPLETED`, số chuyến `CANCELLED` và
      doanh thu chỉ tính từ giao dịch `SUCCESS`. Nếu chưa có dữ liệu, các giá trị bằng 0.
    operationId: getOperationSummary
    x-requirements:
      fr:
      - FR27
      ac:
      - AC27
    responses:
      '200':
        description: Lấy báo cáo thành công
        content:
          application/json:
            schema:
              $ref: ../components/schemas/response-wrappers.yaml#/ReportResponse
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '500':
        $ref: ../components/responses.yaml#/InternalServerError
