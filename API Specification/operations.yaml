operatorCustomers:
  get:
    tags:
    - Operations
    summary: Tra cứu khách hàng
    operationId: searchCustomers
    x-requirements:
      fr:
      - FR25
      ac:
      - AC25
    parameters:
    - $ref: ../components/parameters.yaml#/Keyword
    responses:
      '200':
        description: Danh sách khách hàng phù hợp; có thể là mảng rỗng
        content:
          application/json:
            schema:
              $ref: ../components/schemas/response-wrappers.yaml#/UserListResponse
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
operatorCustomerById:
  parameters:
  - $ref: ../components/parameters.yaml#/CustomerId
  get:
    tags:
    - Operations
    summary: Xem chi tiết khách hàng
    operationId: getCustomerForOperator
    x-requirements:
      fr:
      - FR25
      ac:
      - AC25
    responses:
      '200':
        description: Lấy thông tin khách hàng thành công
        content:
          application/json:
            schema:
              $ref: ../components/schemas/response-wrappers.yaml#/UserResponse
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
