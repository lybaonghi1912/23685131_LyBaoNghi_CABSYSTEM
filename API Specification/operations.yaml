operatorTrips:
  get:
    tags:
    - Operations
    summary: Theo dõi và lọc chuyến đi
    operationId: searchTripsForOperator
    x-requirements:
      fr:
      - FR25
      - FR26
      ac:
      - AC25
      - AC26
    parameters:
    - $ref: ../components/parameters.yaml#/Keyword
    - name: status
      in: query
      required: false
      description: Lọc chuyến theo trạng thái
      schema:
        $ref: ../components/schemas/common.yaml#/TripStatus
    responses:
      '200':
        description: Danh sách chuyến đúng điều kiện; có thể là mảng rỗng
        content:
          application/json:
            schema:
              $ref: ../components/schemas/response-wrappers.yaml#/TripListResponse
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
operatorTripById:
  parameters:
  - $ref: ../components/parameters.yaml#/TripId
  get:
