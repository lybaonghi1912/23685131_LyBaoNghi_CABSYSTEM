openapi: 3.0.3
info:
  title: CAB System API - BR08 - Lịch sử và đánh giá
  version: 1.0.0
  description: |-
    API Specification độc lập cho BR08 - Lịch sử và đánh giá.

    Phạm vi: Xem lịch sử chuyến theo tài khoản và đánh giá tài xế một lần sau chuyến hoàn thành.

    Functional Requirements: FR23, FR24.
    Acceptance Criteria: AC23, AC24.
servers:
- url: http://localhost:3000/api/v1
  description: Máy chủ phát triển cục bộ
security:
- bearerAuth: []
x-requirements:
  fr:
  - FR23
  - FR24
  ac:
  - AC23
  - AC24
tags:
- name: Trips
  description: Đặt, theo dõi, hủy và cập nhật chuyến đi
- name: Ratings
  description: Đánh giá tài xế sau chuyến đi
paths:
  /me/trips:
    get:
      tags:
      - Trips
      summary: Xem lịch sử chuyến của tài khoản
      description: |
        Khách hàng nhận các chuyến do mình đặt; tài xế nhận các chuyến mình thực hiện.
        Danh sách được sắp xếp từ chuyến mới nhất đến cũ nhất.
      operationId: getMyTripHistory
      x-requirements:
        fr:
        - FR23
        ac:
        - AC23
      responses:
        '200':
          description: Lấy lịch sử chuyến thành công; có thể trả về mảng rỗng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /trips/{tripId}/ratings:
    parameters:
    - $ref: '#/components/parameters/TripId'
    post:
      tags:
      - Ratings
      summary: Đánh giá tài xế
      description: |
        Khách hàng sở hữu chuyến được đánh giá đúng một lần sau khi chuyến
        `COMPLETED`. Điểm phải là số nguyên từ 1 đến 5. Sau khi lưu, hệ thống
        cập nhật điểm trung bình của tài xế.
      operationId: rateDriver
      x-requirements:
        fr:
        - FR24
        ac:
        - AC24
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRatingRequest'
            example:
              score: 5
              comment: Tài xế thân thiện và đến đúng giờ
      responses:
        '201':
          description: Đánh giá được tạo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Chuyến chưa hoàn thành hoặc đã được đánh giá
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token nhận được sau khi đăng nhập
  schemas:
    ErrorResponse:
      type: object
      required:
      - success
      - message
      - error
      properties:
        success:
          type: boolean
          enum:
          - false
        message:
          type: string
        error:
          $ref: '#/components/schemas/ErrorInfo'
    ErrorInfo:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        details:
          type: array
          items:
            $ref: '#/components/schemas/ValidationDetail'
    ValidationDetail:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    RatingResponse:
      type: object
      required:
      - success
      - message
      - data
      properties:
        success:
          type: boolean
          enum:
          - true
        message:
          type: string
        data:
          $ref: '#/components/schemas/Rating'
    Rating:
      type: object
      required:
      - id
      - trip_id
      - customer_id
      - driver_id
      - score
      - created_at
      properties:
        id:
          type: string
          example: rating_001
        trip_id:
          type: string
          example: trip_001
        customer_id:
          type: string
          example: user_customer_001
        driver_id:
          type: string
          example: driver_001
        score:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          nullable: true
          example: Tài xế thân thiện và đến đúng giờ
        created_at:
          type: string
          format: date-time
    CreateRatingRequest:
      type: object
      additionalProperties: false
      required:
      - score
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 500
    TripListResponse:
      type: object
      required:
      - success
      - message
      - data
      properties:
        success:
          type: boolean
          enum:
          - true
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Trip'
    Trip:
      type: object
      required:
      - id
      - customer_id
      - vehicle_type
      - pickup_address
      - pickup_latitude
      - pickup_longitude
      - destination_address
      - destination_latitude
      - destination_longitude
      - distance_km
      - trip_status
      - fare_amount
      - created_at
      properties:
        id:
          type: string
          example: trip_001
        customer_id:
          type: string
          example: user_customer_001
        driver_id:
          type: string
          nullable: true
          example: driver_001
        driver:
          allOf:
          - $ref: '#/components/schemas/DriverSummary'
          nullable: true
        vehicle_type:
          $ref: '#/components/schemas/VehicleType'
        pickup_address:
          type: string
        pickup_latitude:
          type: number
          format: double
        pickup_longitude:
          type: number
          format: double
        destination_address:
          type: string
        destination_latitude:
          type: number
          format: double
        destination_longitude:
          type: number
          format: double
        distance_km:
          type: number
          format: double
          minimum: 0
        trip_status:
          $ref: '#/components/schemas/TripStatus'
        fare_amount:
          type: number
          format: double
          minimum: 0
          description: |
            Bằng 0 trước khi hoàn thành. Khi `COMPLETED`:
            `MOTORBIKE = 10000 + distance_km × 5000`;
            `CAR = 20000 + distance_km × 10000`.
          example: 37000
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
    TripStatus:
      type: string
      enum:
      - SEARCHING
      - ACCEPTED
      - ARRIVED
      - IN_PROGRESS
      - COMPLETED
      - CANCELLED
      - NO_DRIVER
    VehicleType:
      type: string
      enum:
      - MOTORBIKE
      - CAR
    DriverSummary:
      type: object
      required:
      - id
      - full_name
      - phone
      - average_rating
      - vehicle
      properties:
        id:
          type: string
          example: driver_001
        full_name:
          type: string
          example: Trần Văn Bình
        phone:
          type: string
          example: 0987654321
        average_rating:
          type: number
          format: double
          example: 4.8
        vehicle:
          $ref: '#/components/schemas/Vehicle'
    Vehicle:
      type: object
      required:
      - id
      - driver_id
      - vehicle_type
      - license_plate
      properties:
        id:
          type: string
          example: vehicle_001
        driver_id:
          type: string
          example: driver_001
        vehicle_type:
          $ref: '#/components/schemas/VehicleType'
        license_plate:
          type: string
          example: 59A1-12345
        brand:
          type: string
          nullable: true
          example: Honda Wave
  responses:
    NotFound:
      description: Không tìm thấy dữ liệu yêu cầu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Không tìm thấy dữ liệu
            error:
              code: NOT_FOUND
    Forbidden:
      description: Tài khoản không có quyền thực hiện chức năng
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Bạn không có quyền thực hiện chức năng này
            error:
              code: FORBIDDEN
    Unauthorized:
      description: Chưa đăng nhập hoặc token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Bạn cần đăng nhập
            error:
              code: UNAUTHORIZED
    BadRequest:
      description: Dữ liệu đầu vào thiếu hoặc không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Dữ liệu đầu vào không hợp lệ
            error:
              code: VALIDATION_ERROR
              details:
              - field: vehicle_type
                message: Giá trị không hợp lệ
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      description: Mã chuyến đi
      schema:
        type: string
      example: trip_001
