Notification:
  type: object
  required:
  - id
  - user_id
  - notification_type
  - message
  - is_read
  - created_at
  properties:
    id:
      type: string
      example: notification_001
    user_id:
      type: string
      example: user_customer_001
    trip_id:
      type: string
      nullable: true
      example: trip_001
    notification_type:
      type: string
      example: DRIVER_FOUND
    message:
      type: string
      example: Đã tìm thấy tài xế cho chuyến của bạn
    is_read:
      type: boolean
      default: false
    created_at:
      type: string
      format: date-time
ReportSummary:
  type: object
  required:
  - total_trips
  - completed_trips
  - cancelled_trips
  - total_revenue
  properties:
    total_trips:
      type: integer
      minimum: 0
      example: 120
    completed_trips:
      type: integer
      minimum: 0
      example: 100
    cancelled_trips:
      type: integer
      minimum: 0
      example: 12
    total_revenue:
      type: number
      format: double
      minimum: 0
      description: Tổng tiền từ các giao dịch SUCCESS
      example: 4250000
