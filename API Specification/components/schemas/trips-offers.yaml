CreateTripRequest:
  type: object
  additionalProperties: false
  required:
  - vehicle_type
  - pickup_address
  - pickup_latitude
  - pickup_longitude
  - destination_address
  - destination_latitude
  - destination_longitude
  - distance_km
  properties:
    vehicle_type:
      $ref: ./common.yaml#/VehicleType
    pickup_address:
      type: string
      minLength: 1
    pickup_latitude:
      type: number
      format: double
      minimum: -90
      maximum: 90
    pickup_longitude:
      type: number
      format: double
      minimum: -180
      maximum: 180
    destination_address:
      type: string
      minLength: 1
    destination_latitude:
      type: number
      format: double
      minimum: -90
      maximum: 90
    destination_longitude:
      type: number
      format: double
      minimum: -180
      maximum: 180
    distance_km:
      type: number
      format: double
      exclusiveMinimum: true
      minimum: 0
OfferDecisionRequest:
  type: object
  additionalProperties: false
  required:
  - decision
  properties:
    decision:
      type: string
      enum:
      - ACCEPT
      - REJECT
TripStatusRequest:
  type: object
  additionalProperties: false
  required:
  - trip_status
  properties:
    trip_status:
      type: string
      enum:
      - ARRIVED
      - IN_PROGRESS
      - COMPLETED
Trip:
  type: object
  required:
  - id
  - customer_id
  - vehicle_type
  - pickup_address
  - pickup_latitude
  - pickup_longitude
  - destination_address
  - destination_latitude
  - destination_longitude
  - distance_km
  - trip_status
  - fare_amount
  - created_at
  properties:
    id:
      type: string
      example: trip_001
    customer_id:
      type: string
      example: user_customer_001
    driver_id:
      type: string
      nullable: true
      example: driver_001
    driver:
      allOf:
      - $ref: ./authentication-profiles.yaml#/DriverSummary
      nullable: true
      type: object
    vehicle_type:
      $ref: ./common.yaml#/VehicleType
    pickup_address:
      type: string
    pickup_latitude:
      type: number
      format: double
    pickup_longitude:
      type: number
      format: double
    destination_address:
      type: string
    destination_latitude:
      type: number
      format: double
    destination_longitude:
      type: number
      format: double
    distance_km:
      type: number
      format: double
      minimum: 0
    trip_status:
      $ref: ./common.yaml#/TripStatus
    fare_amount:
      type: number
      format: double
      minimum: 0
      description: |
        Bằng 0 trước khi hoàn thành. Khi `COMPLETED`:
        `MOTORBIKE = 10000 + distance_km × 5000`;
        `CAR = 20000 + distance_km × 10000`.
      example: 37000
    created_at:
      type: string
      format: date-time
    completed_at:
      type: string
      format: date-time
      nullable: true
DriverOffer:
  type: object
  required:
  - id
  - trip_id
  - driver_id
  - offer_status
  - expires_at
  properties:
    id:
      type: string
      example: offer_001
    trip_id:
      type: string
      example: trip_001
    driver_id:
      type: string
      example: driver_001
    offer_status:
      $ref: ./common.yaml#/OfferStatus
    expires_at:
      type: string
      format: date-time
    responded_at:
      type: string
      format: date-time
      nullable: true
    trip:
      $ref: ./trips-offers.yaml#/Trip
