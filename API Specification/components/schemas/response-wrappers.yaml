UserResponse:
  type: object
  required:
  - success
  - message
  - data
  properties:
    success:
      type: boolean
      enum:
      - true
    message:
      type: string
      example: Thao tác thành công
    data:
      $ref: ./authentication-profiles.yaml#/User
AuthResponse:
  type: object
  required:
  - success
  - message
  - data
  properties:
    success:
      type: boolean
      enum:
      - true
    message:
      type: string
      example: Đăng nhập thành công
    data:
      type: object
      required:
      - token
      - user
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9.example
