RegisterRequest:
  type: object
  additionalProperties: false
  required:
  - full_name
  - email
  - password
  - phone
  - role
  properties:
    full_name:
      type: string
      minLength: 1
      maxLength: 100
    email:
      type: string
      format: email
    password:
      type: string
      format: password
      minLength: 6
      writeOnly: true
    phone:
      type: string
      minLength: 9
      maxLength: 15
    role:
      $ref: ./common.yaml#/RegisterRole
LoginRequest:
  type: object
  additionalProperties: false
  required:
  - email
  - password
  properties:
    email:
      type: string
      format: email
    password:
      type: string
      format: password
      writeOnly: true
UpdateProfileRequest:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    full_name:
      type: string
      minLength: 1
      maxLength: 100
    phone:
      type: string
      minLength: 9
      maxLength: 15
VehicleRequest:
  type: object
  additionalProperties: false
  required:
  - vehicle_type
  - license_plate
  properties:
    vehicle_type:
      $ref: ./common.yaml#/VehicleType
    license_plate:
      type: string
      minLength: 4
      maxLength: 20
    brand:
      type: string
      maxLength: 100
DriverStatusRequest:
  type: object
  additionalProperties: false
  required:
  - driver_status
  properties:
    driver_status:
      type: string
      enum:
      - AVAILABLE
      - OFFLINE
User:
  type: object
  required:
  - id
  - full_name
  - email
  - phone
  - role
  - created_at
  properties:
    id:
      type: string
      example: user_001
    full_name:
      type: string
      example: Nguyễn Văn An
    email:
      type: string
      format: email
      example: an@example.com
    phone:
      type: string
      example: '0901234567'
    role:
      $ref: ./common.yaml#/UserRole
    created_at:
      type: string
      format: date-time
  description: Mật khẩu và password_hash không bao giờ được trả về trong API.
DriverProfile:
  type: object
  required:
  - id
  - user_id
  - driver_status
  - average_rating
  properties:
    id:
      type: string
      example: driver_001
    user_id:
      type: string
      example: user_driver_001
    driver_status:
      $ref: ./common.yaml#/DriverStatus
    current_latitude:
      type: number
      format: double
      nullable: true
      example: 10.8222
    current_longitude:
      type: number
      format: double
      nullable: true
      example: 106.6872
    average_rating:
      type: number
      format: double
      minimum: 0
      maximum: 5
      example: 4.8
Vehicle:
  type: object
  required:
  - id
  - driver_id
  - vehicle_type
  - license_plate
  properties:
    id:
      type: string
      example: vehicle_001
    driver_id:
      type: string
      example: driver_001
    vehicle_type:
      $ref: ./common.yaml#/VehicleType
    license_plate:
      type: string
      example: 59A1-12345
    brand:
      type: string
      nullable: true
      example: Honda Wave
DriverDetails:
  type: object
  required:
  - user
  - driver_profile
  properties:
    user:
      $ref: ./authentication-profiles.yaml#/User
    driver_profile:
      $ref: ./authentication-profiles.yaml#/DriverProfile
    vehicle:
      allOf:
      - $ref: ./authentication-profiles.yaml#/Vehicle
      nullable: true
      type: object
MyProfile:
  type: object
  required:
  - user
  properties:
    user:
      $ref: ./authentication-profiles.yaml#/User
    driver_profile:
      allOf:
      - $ref: ./authentication-profiles.yaml#/DriverProfile
      nullable: true
      type: object
    vehicle:
      allOf:
      - $ref: ./authentication-profiles.yaml#/Vehicle
      nullable: true
      type: object
DriverSummary:
  type: object
  required:
  - id
  - full_name
  - phone
  - average_rating
  - vehicle
  properties:
    id:
      type: string
      example: driver_001
    full_name:
      type: string
      example: Trần Văn Bình
    phone:
      type: string
      example: '0987654321'
    average_rating:
      type: number
      format: double
      example: 4.8
    vehicle:
      $ref: ./authentication-profiles.yaml#/Vehicle
