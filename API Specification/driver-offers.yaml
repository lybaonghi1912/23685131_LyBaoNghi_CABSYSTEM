currentDriverOffer:
  get:
    tags:
    - Driver Offers
    summary: Xem đề xuất chuyến còn hiệu lực
    description: |
      Trả về đề xuất `PENDING` dành cho tài xế đang đăng nhập, bao gồm chuyến
      và thời điểm hết hạn phản hồi.
    operationId: getCurrentDriverOffer
    x-requirements:
      fr:
      - FR12
      ac:
      - AC12
    responses:
      '200':
        description: Lấy đề xuất chuyến thành công
        content:
          application/json:
            schema:
              $ref: ../components/schemas/response-wrappers.yaml#/DriverOfferResponse
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        description: Không có đề xuất chuyến còn hiệu lực
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
driverOfferResponse:
  parameters:
  - $ref: ../components/parameters.yaml#/OfferId
  post:
    tags:
    - Driver Offers
    summary: Chấp nhận hoặc từ chối đề xuất chuyến
    description: |
      Tài xế phản hồi đề xuất còn hiệu lực trong 30 giây.

      - `ACCEPT`: phân công tài xế, chuyển chuyến sang `ACCEPTED` và tài xế sang `BUSY`.
      - `REJECT`: ghi nhận từ chối và hệ thống tự chuyển sang tài xế tiếp theo.
      - Hết hạn: hệ thống đánh dấu `EXPIRED` và tự chuyển sang tài xế tiếp theo.
      - Hết tài xế phù hợp: chuyến chuyển sang `NO_DRIVER` và thông báo khách hàng.
    operationId: respondToDriverOffer
    x-requirements:
      fr:
      - FR13
      - FR14
      - FR17
      - FR21
      ac:
      - AC13
      - AC14
      - AC17
      - AC21
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/trips-offers.yaml#/OfferDecisionRequest
          example:
            decision: ACCEPT
    responses:
      '200':
        description: Phản hồi được ghi nhận
        content:
          application/json:
            schema:
              $ref: ../components/schemas/response-wrappers.yaml#/DriverOfferResponse
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        description: Đề xuất đã được phản hồi hoặc đã hết hạn
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
