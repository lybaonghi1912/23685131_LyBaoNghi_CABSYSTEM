openapi: 3.0.3
info:
  title: CAB System - Driver Offers API
  version: 1.1.0
  description: >-
    API đề xuất chuyến và phản hồi của tài xế. Đồng bộ với FR12-FR14, FR17, FR21
    và các AC liên quan trong srs.md.
servers:
  - url: http://localhost:3000/api/v1
security:
  - bearerAuth: []
tags:
  - name: Driver Offers
paths:
  /driver-offers/current:
    get:
      tags: [Driver Offers]
      summary: Xem đề xuất chuyến còn hiệu lực
      operationId: getCurrentDriverOffer
      description: Chỉ DRIVER được xem offer PENDING thuộc chính mình và chưa hết hạn.
      x-requirements:
        fr: [FR12]
        ac: [AC12]
      responses:
        '200':
          description: Lấy offer thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverOfferResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Không có offer còn hiệu lực
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /driver-offers/{offerId}/response:
    parameters:
      - $ref: '#/components/parameters/OfferId'
    post:
      tags: [Driver Offers]
      summary: Chấp nhận hoặc từ chối đề xuất chuyến
      operationId: respondToDriverOffer
      description: >-
        Offer chỉ được phản hồi một lần khi còn PENDING, chưa quá expires_at, trip vẫn SEARCHING
        và Driver vẫn AVAILABLE. ACCEPT gán tài xế và chuyển Driver BUSY. REJECT chuyển sang
        tài xế tiếp theo. Nếu sau 30 giây offer vẫn PENDING, hệ thống tự chuyển EXPIRED và tìm
        ứng viên tiếp theo. Offer CANCELLED xuất hiện khi Customer hủy trip SEARCHING.
      x-requirements:
        fr: [FR13, FR14, FR17, FR21]
        ac: [AC13, AC14, AC17, AC21]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfferDecisionRequest' }
      responses:
        '200':
          description: Phản hồi được ghi nhận
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverOfferResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Offer không còn hiệu lực, trip không còn SEARCHING hoặc Driver không còn AVAILABLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OfferId:
      name: offerId
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Dữ liệu đầu vào không hợp lệ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Chưa đăng nhập hoặc token không hợp lệ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Không đúng vai trò hoặc offer không thuộc tài xế hiện tại
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Không tìm thấy offer
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    OfferStatus:
      type: string
      enum: [PENDING, ACCEPTED, REJECTED, EXPIRED, CANCELLED]
    OfferDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [ACCEPT, REJECT]
    DriverOffer:
      type: object
      required: [id, trip_id, driver_id, offer_status, expires_at]
      properties:
        id: { type: string, example: offer_001 }
        trip_id: { type: string, example: trip_001 }
        driver_id: { type: string, example: driver_001 }
        offer_status: { $ref: '#/components/schemas/OfferStatus' }
        expires_at: { type: string, format: date-time }
        responded_at: { type: string, format: date-time, nullable: true }
    ErrorInfo:
      type: object
      required: [code]
      properties:
        code: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    ErrorResponse:
      type: object
      required: [success, message, error]
      properties:
        success: { type: boolean, enum: [false] }
        message: { type: string }
        error: { $ref: '#/components/schemas/ErrorInfo' }
    DriverOfferResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        data: { $ref: '#/components/schemas/DriverOffer' }
